services:
  - type: web
    name: mwoms
    runtime: node
    plan: free
    buildCommand: NPM_CONFIG_PRODUCTION=false npm ci --include=dev --prefix frontend && NPM_CONFIG_PRODUCTION=false npm ci --include=dev --prefix backend && npm run build --prefix frontend && npm run prisma:generate --prefix backend && npm run prisma:push --prefix backend -- --accept-data-loss && npm run build --prefix backend
    preDeployCommand: npm run prisma:seed --prefix backend
    startCommand: npm run start --prefix backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://mwoms.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: SEED_ADMIN_EMPLOYEE_ID
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mwoms-db
          property: connectionString

databases:
  - name: mwoms-db
    plan: free
    databaseName: mwoms
    user: mwoms